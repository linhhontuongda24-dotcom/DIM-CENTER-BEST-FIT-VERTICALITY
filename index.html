<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DIM Center Fit (App)</title>
  <meta name="application-name" content="DIM Center Fit" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DIM Center Fit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <link id="appIconLink" rel="apple-touch-icon" href="" />
  <link id="faviconLink" rel="icon" type="image/png" href="" />
  <link id="manifestLink" rel="manifest" href="" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.4;
    }
    .container { max-width: 760px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 18px; margin: 0; color: var(--primary); }
    .badge { font-size: 11px; background: #0284c7; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    
    /* Banner hướng dẫn cài ra màn hình chính */
    #installBanner {
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;
      display: none; align-items: center; justify-content: space-between; gap: 10px;
    }
    .install-btn {
      background: var(--primary); color: #0f172a; border: none; border-radius: 6px;
      padding: 7px 12px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; flex: none;
    }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin-bottom: 12px;
    }
    .card-title {
      font-weight: 700; font-size: 14px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 110px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    select, input[type="number"] {
      width: 100%; padding: 10px; border-radius: 6px;
      border: 1px solid var(--border); background: #0f172a;
      color: var(--text); font-size: 16px; font-weight: 600;
    }
    input[type="number"]:focus, select:focus { outline: none; border-color: var(--primary); }
    
    .switch-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; }
    .tilt-box {
      background: #0f172a; border: 1px dashed var(--accent);
      border-radius: 8px; padding: 12px; margin-top: 8px; display: none;
    }
    .tilt-box.active { display: block; }

    .mode-selector {
      display: flex; gap: 8px; margin-bottom: 10px; background: #1e293b; padding: 6px; border-radius: 8px; border: 1px solid var(--border);
    }
    .mode-option {
      flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 10px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted);
      border: 1px solid transparent; margin: 0;
    }
    .mode-option.selected {
      background: rgba(56, 189, 248, 0.15); color: var(--primary); border-color: var(--primary);
    }
    .mode-option input { margin: 0; accent-color: var(--primary); }

    .points-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    @media (min-width: 500px) {
      .points-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .pt-item {
      background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px;
    }
    .pt-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 3px; }
    .pt-item input { padding: 6px 8px; font-size: 15px; border: none; background: #1e293b; }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-calc { background: var(--primary); color: #0f172a; }
    .btn-sample { background: #334155; color: var(--text); flex: 0.5; }
    .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); flex: 0.4; }

    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .kpi {
      background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; text-align: center;
    }
    .kpi.highlight { border-color: var(--primary); }
    .kpi.vector-kpi { border-color: var(--success); background: rgba(34, 197, 94, 0.08); grid-column: span 2; }
    .kpi.warn { border-color: var(--accent); }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-val { font-size: 20px; font-weight: 800; margin-top: 2px; }
    .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .direction-guide {
      background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--primary);
      padding: 10px 12px; border-radius: 4px; margin-bottom: 12px; font-size: 14px;
    }
    .direction-guide ul { margin: 6px 0 0 0; padding-left: 18px; }
    .direction-guide li { margin-bottom: 5px; }

    .canvas-controls {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 12px; color: var(--muted);
    }
    .canvas-controls label {
      display: inline-flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; color: var(--text);
    }

    canvas {
      width: 100%; max-width: 480px; height: auto; aspect-ratio: 1 / 1;
      display: block; margin: 0 auto; background: #0f172a; border-radius: 8px; border: 1px solid var(--border);
    }

    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 360px; }
    th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; background: #0f172a; }
    th:first-child, td:first-child { text-align: center; }
    .pos { color: #f87171; font-weight: 700; }
    .neg { color: #38bdf8; font-weight: 700; }
    .true-r-cell { color: #fde047; font-weight: 700; }
  </style>
  <style>
    #lockScreen {
      max-width: 440px; margin: 40px auto; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    .dev-id-box {
      background: #0f172a; border: 1px dashed #38bdf8; padding: 12px; border-radius: 8px;
      font-size: 20px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; margin: 12px 0;
      user-select: all;
    }
    #inputLicenseKey {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #4ade80; font-size: 16px; font-weight: 700; text-align: center;
      text-transform: uppercase; box-sizing: border-box;
    }
  </style>
</head>

          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : '') + b.toString(16);
      }
    }
    return result.toUpperCase();
  }

  function _safeGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function _safeSet(k, v) {
    try { localStorage.setItem(k, v); } catch (e) {}
  }
  function getDeviceId() {
    var salt = _safeGet('dim_hw_salt_v2');
    if (!salt) {
      // Tạo mã cố định theo phần cứng trình duyệt nếu localStorage bị khóa, hoặc lưu salt nếu cho phép
      var hwSig = [
        navigator.userAgent || '',
        screen.width + 'x' + screen.height,
        screen.colorDepth || '24',
        navigator.hardwareConcurrency || '4',
        navigator.platform || '',
        Intl.DateTimeFormat().resolvedOptions().timeZone || ''
      ].join('#');
      salt = _sha256(hwSig).slice(0, 12);
      _safeSet('dim_hw_salt_v2', salt);
    }
    var raw = [
      navigator.userAgent || '',
      screen.width + 'x' + screen.height,
      navigator.hardwareConcurrency || '4',
      salt
    ].join('|');
    var h = _sha256(raw);
    return "DIM-" + h.slice(0, 4) + "-" + h.slice(4, 8);
  }
  function getExpectedKey(devId) {
    var sec = _b64Dec(_0xS);
    var h = _sha256(devId + "::" + sec + "::DIM_PRO_LOCK");
    return "PRO-" + h.slice(0, 4) + "-" + h.slice(8, 12) + "-" + h.slice(16, 20);
  }
  function unlockApp(devId) {
    document.getElementById('lockScreen').style.display = 'none';
    var root = document.getElementById('appRoot');
    root.innerHTML = _b64Dec(_0xH);
    var hdr = root.querySelector('header div');
    if (hdr) {
      var tag = document.createElement('div');
      tag.style.cssText = 'font-size:11px; color:#64748b; margin-top:2px;';
      tag.innerHTML = 'Licensed ID: <span style="color:#38bdf8; font-weight:700;">' + devId + '</span>';
      hdr.appendChild(tag);
    }
    var sc = document.createElement('script');
    sc.textContent = _b64Dec(_0xJ);
    document.body.appendChild(sc);
  }
  function initLock() {
    try {
      var devId = getDeviceId();
      document.getElementById('displayDeviceId').textContent = devId;
      var saved = _safeGet('dim_key_v2');
      if (saved && saved === getExpectedKey(devId)) {
        unlockApp(devId);
      }
    } catch (err) {
      document.getElementById('lockError').textContent = "⚠️ Vui lòng mở bằng trình duyệt Safari/Chrome (không mở qua trình xem trước Zalo).";
    }
  }
  function verifyAndUnlock() {
    var devId = document.getElementById('displayDeviceId').textContent.trim();
    var inp = document.getElementById('inputLicenseKey').value.trim().toUpperCase();
    if (inp === getExpectedKey(devId)) {
      _safeSet('dim_key_v2', inp);
      unlockApp(devId);
    } else {
      document.getElementById('lockError').textContent = "❌ Mã kích hoạt không hợp lệ hoặc sai thiết bị!";
    }
  }
  function copyDeviceId() {
    var txt = document.getElementById('displayDeviceId').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function() { alert("Đã sao chép: " + txt); });
    } else {
      prompt("Copy Mã Thiết Bị bên dưới:", txt);
    }
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
      e.preventDefault();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
  initLock();
</script>
